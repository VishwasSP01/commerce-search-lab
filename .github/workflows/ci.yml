name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression tests (Python 3.12 and Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java ranker
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Run Python and packaged integration tests
        env:
          REQUIRE_BM25_JAR: "1"
        run: uv run --locked --no-sync python -m unittest discover -s tests -v

      - name: Verify native k6 metrics and response validation on loopback fixtures
        run: uv run --locked --no-sync python scripts/k6_fixture.py

  embedding-fixtures:
    name: Embedding contract (CPU, offline fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false

      - name: Install locked pilot dependencies (CPU-only on Linux)
        run: uv sync --locked --project experiments/embedding-pilot

      - name: Verify offline encoder, shard integrity and exhaustive search
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: uv run --locked --no-sync --project experiments/embedding-pilot python -m unittest discover -s experiments/embedding-pilot/tests -v

  ann-fixtures:
    name: ANN contract (CPU, native fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false

      - name: Install isolated CPU ANN environment
        run: uv sync --locked --project experiments/ann-benchmark

      - name: Verify native graph persistence, ties, locale identities and quality budgets
        run: uv run --locked --no-sync --project experiments/ann-benchmark python -m unittest discover -s experiments/ann-benchmark/tests -v

  elasticsearch-fixtures:
    name: Elasticsearch parity (CPU, native fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frozen dependencies and package the reference
        run: |
          uv sync --locked
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Build and start pinned local backend
        run: docker compose -f infra/elasticsearch/compose.yml up -d --build

      - name: Verify synthetic multilingual parity on real Elasticsearch
        run: uv run --locked --no-sync python scripts/elasticsearch_fixture.py

      - name: Verify bounded immutable catalog loader on real Elasticsearch
        run: uv run --locked --no-sync python scripts/catalog_loader_fixture.py

      - name: Verify and package Java search API
        run: ./mvnw -f services/search-api/pom.xml --batch-mode --no-transfer-progress verify

      - name: Verify packaged HTTP API against the synthetic Elasticsearch corpus
        run: uv run --locked --no-sync python scripts/verify_search_api.py --fixture

      - name: Stop and remove only this fixture stack
        if: always()
        run: docker compose -f infra/elasticsearch/compose.yml down -v

spring.application.name=commerce-search-api
server.address=127.0.0.1
server.port=18080
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=64
server.tomcat.accept-count=32
server.tomcat.connection-timeout=5s
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
commerce.backend-url=http://127.0.0.1:19200
commerce.index=csl-pilot-es-v1-c
commerce.connect-timeout-ms=300
commerce.request-timeout-ms=2000

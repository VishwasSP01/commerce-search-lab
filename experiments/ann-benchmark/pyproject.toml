[project]
name = "commerce-ann-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb==2.0.0", "numpy==2.3.4", "faiss-cpu==1.15.1"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
